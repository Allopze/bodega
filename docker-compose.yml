# Docker Compose for Plataforma Chome
#
# This file IS version-controlled. Do not make ad-hoc changes on the VPS;
# commit them here and pull in production.
#
# Usage:
#   docker compose up -d --build         # self-contained: build from the bundled
#                                        # Dockerfile/source (release.zip deploys)
#   docker compose up -d                 # CI: uses the image pulled from GHCR
#   docker compose up -d --no-deps app   # replace app container only
#   docker compose down                  # stop
#
# Environment variables are read from a .env file or the host's environment.
# Copy .env.example to .env and fill in production values.
#
# Self-contained DB: a `db` (postgres) service ships in this file and a one-shot
# `migrate` service applies the Drizzle migrations before `app` starts. For that
# path you only need to set POSTGRES_PASSWORD (and AUTH_SECRET/AUTH_URL);
# DATABASE_URL is derived to point at the `db` service.
#
# Managed / external DB: set DATABASE_URL explicitly and deploy only the app
# with `docker compose up -d --no-deps app` (skips the bundled db + migrate).

services:
  app:
    # Two deploy paths share this file:
    #   • CI/GHCR: the image is built by CI and pushed; the VPS pulls the SHA tag
    #     (set IMAGE_TAG) before `up`, so `build` is never triggered.
    #   • Self-contained (release.zip): `up --build` builds the bundled Dockerfile
    #     and tags it with the `image` name below.
    build:
      context: .
      target: prod
    image: ghcr.io/${GITHUB_REPOSITORY:-chome/bodega}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      - NODE_ENV=production
      # node:22.13-alpine corre en UTC. `lib/sst/date.ts` construye fechas con la
      # hora del sistema y `lib/utils.ts` las formatea fijando America/Santiago:
      # en UTC, la medianoche que produce `parseLocalDate` todavía es el día
      # anterior en Chile y la fecha se renderiza corrida un día — de forma
      # permanente, no sólo de noche. `todayLocalISO()` además adelanta el día
      # entre las 20:00 y medianoche. Node 22 resuelve la zona por ICU, así que
      # no hace falta el paquete tzdata.
      - TZ=America/Santiago
      # Next standalone (node server.js) binds to $HOSTNAME; Docker sets that to the
      # container id, so it only listens on the container's eth0 IP and the internal
      # healthcheck (wget localhost:3000) gets ECONNREFUSED → container marked unhealthy.
      # Force bind to all interfaces so loopback works too.
      - HOSTNAME=0.0.0.0
      - DATABASE_URL=${DATABASE_URL:-postgres://${POSTGRES_USER:-bodega}:${POSTGRES_PASSWORD:?err}@db:5432/${POSTGRES_DB:-bodega}}
      - AUTH_SECRET=${AUTH_SECRET:?err}
      - AUTH_SECRET_PREVIOUS=${AUTH_SECRET_PREVIOUS:-}
      - APP_URL=${APP_URL:?err}
      - PDF_RENDER_ORIGIN=${PDF_RENDER_ORIGIN:-http://127.0.0.1:3000}
      - AUTH_URL=${AUTH_URL:?err}
      - NEXTAUTH_SECRET=${NEXTAUTH_SECRET:-}
      - PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH=${PLAYWRIGHT_CHROMIUM_EXECUTABLE_PATH:-/usr/bin/chromium-browser}
      # Credenciales Copec TCT/TAE (portal de informes)
      - COPEC_USERNAME=${COPEC_USERNAME:-}
      - COPEC_PASSWORD=${COPEC_PASSWORD:-}
      - COPEC_SYNC_START_DATE=${COPEC_SYNC_START_DATE:-2020-01-01}
      - COPEC_SYNC_IMPORTER_EMAIL=${COPEC_SYNC_IMPORTER_EMAIL:-}
      - ARAMCO_DOCUMENT_NUMBER=${ARAMCO_DOCUMENT_NUMBER:-}
      - ARAMCO_PASSWORD=${ARAMCO_PASSWORD:-}
      - ARAMCO_SYNC_ENABLED=${ARAMCO_SYNC_ENABLED:-false}
      - ARAMCO_SYNC_IMPORTER_EMAIL=${ARAMCO_SYNC_IMPORTER_EMAIL:-}
      - ONWAY_USERNAME=${ONWAY_USERNAME:-}
      - ONWAY_PASSWORD=${ONWAY_PASSWORD:-}
      - ONWAY_SYNC_ENABLED=${ONWAY_SYNC_ENABLED:-false}
      # Cron endpoints and the DTE/billing integrations are server-only. A
      # Compose `.env` is used for interpolation; these explicit mappings are
      # what actually put the values into the running app container.
      - CRON_SECRET=${CRON_SECRET:-}
      - CRON_ALLOWED_SOURCES=${CRON_ALLOWED_SOURCES:-}
      - DTE_PORTAL_BASE_URL=${DTE_PORTAL_BASE_URL:-https://clientes.dtefacturaenlinea.cl/facturaenlinea}
      - DTE_PORTAL_RUT_USR=${DTE_PORTAL_RUT_USR:-}
      - DTE_PORTAL_RUT_EMP=${DTE_PORTAL_RUT_EMP:-}
      - DTE_PORTAL_CLAVE=${DTE_PORTAL_CLAVE:-}
      - DTE_PORTAL_CODEMP=${DTE_PORTAL_CODEMP:-}
      - DTE_SYNC_IMPORTER_EMAIL=${DTE_SYNC_IMPORTER_EMAIL:-}
      - DTE_SYNC_DELAY_MS=${DTE_SYNC_DELAY_MS:-500}
      - DTE_SYNC_ENABLED=${DTE_SYNC_ENABLED:-false}
      # Keyring de sobres AES-GCM. Estas claves sólo entran al proceso app;
      # cron nunca recibe DTE_SETTINGS_* ni credenciales del portal.
      - DTE_SETTINGS_KEYRING=${DTE_SETTINGS_KEYRING:-}
      - DTE_SETTINGS_ACTIVE_KEY_ID=${DTE_SETTINGS_ACTIVE_KEY_ID:-}
      - DTE_SETTINGS_MODE=${DTE_SETTINGS_MODE:-compat}
      - BILLING_SALES_SYNC_ENABLED=${BILLING_SALES_SYNC_ENABLED:-false}
      - BILLING_HISTORY_FLOOR=${BILLING_HISTORY_FLOOR:-2024-01}
      - BILLING_MATCH_AMOUNT_TOLERANCE_CLP=${BILLING_MATCH_AMOUNT_TOLERANCE_CLP:-1000}
      - BILLING_MATCH_DATE_WINDOW_DAYS=${BILLING_MATCH_DATE_WINDOW_DAYS:-60}
      - BILLING_COMPANY_TAX_ID=${BILLING_COMPANY_TAX_ID:-}
      - BILLING_CHIPAX_ENABLED=${BILLING_CHIPAX_ENABLED:-false}
      - BILLING_CHIPAX_SYNC_ENABLED=${BILLING_CHIPAX_SYNC_ENABLED:-false}
      - CHIPAX_OPENAPI_URL=${CHIPAX_OPENAPI_URL:-https://api.chipax.com/v2/swagger-docs/}
      - CHIPAX_API_BASE_URL=${CHIPAX_API_BASE_URL:-}
      - CHIPAX_APP_ID=${CHIPAX_APP_ID:-}
      - CHIPAX_SECRET_KEY=${CHIPAX_SECRET_KEY:-}
      - CHIPAX_REQUEST_TIMEOUT_MS=${CHIPAX_REQUEST_TIMEOUT_MS:-30000}
      # Outbound mail runs on Resend (lib/email/smtp.ts). Without this key the app
      # boots fine but stays silent (no emails: invitations, password reset, etc.).
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - SENTRY_DSN=${SENTRY_DSN:-}
      - STORAGE_PATH=${STORAGE_PATH:-/data/storage}
      # Backend de documentos SST: filesystem (default) o cloudreve. Solo
      # `cloudreve` activa las credenciales de abajo.
      - SST_STORAGE_BACKEND=${SST_STORAGE_BACKEND:-filesystem}
      # Passthrough, nunca un valor literal: las credenciales de Cloudreve se
      # guardan cifradas en system_settings o se inyectan desde el .env del host.
      - CLOUDREVE_BASE_URL=${CLOUDREVE_BASE_URL:-}
      - CLOUDREVE_USERNAME=${CLOUDREVE_USERNAME:-}
      - CLOUDREVE_PASSWORD=${CLOUDREVE_PASSWORD:-}
      - CLOUDREVE_REQUEST_TIMEOUT_MS=${CLOUDREVE_REQUEST_TIMEOUT_MS:-}
      # Carpeta remota dentro del WebDAV para los documentos SST (default
      # storage/sst-documents). Ej: Prevención/Plataforma si la app usa una
      # subcarpeta propia dentro de la carpeta compartida del drive de Chome.
      - CLOUDREVE_SST_PATH=${CLOUDREVE_SST_PATH:-}
      - BACKUP_DIR=${BACKUP_DIR:-/data/backups}
      - GDRIVE_BACKUPS_DEST=${GDRIVE_BACKUPS_DEST:-}
      - RETENTION_DAYS=${RETENTION_DAYS:-30}
      # Passthrough, nunca un valor literal. `app` también respalda: el botón
      # de Administración › Respaldos invoca al mismo orquestador. Sin esto el
      # respaldo manual subiría EN CLARO mientras el programado va cifrado.
      - BACKUP_ENCRYPTION_PASSPHRASE=${BACKUP_ENCRYPTION_PASSPHRASE:-}
      - BACKUP_SCRIPTS_PATH=${BACKUP_SCRIPTS_PATH:-}
      - RCLONE_CONFIG=${RCLONE_CONFIG:-}
      - NEXT_PUBLIC_VERCEL_GIT_COMMIT_SHA=${NEXT_PUBLIC_VERCEL_GIT_COMMIT_SHA:-}
    volumes:
      - bodega-storage:/data/storage
      # Destino local de los respaldos: volumen nombrado por defecto, o bind
      # mount del host cuando BACKUP_HOST_PATH define una ruta absoluta (p. ej.
      # /srv/backups/plataforma). La ruta interna no cambia: los scripts siguen
      # viendo BACKUP_DIR=/data/backups dentro del contenedor.
      - ${BACKUP_HOST_PATH:-bodega-backups}:/data/backups
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s

  # Daily backup scheduler: runs backup-orchestrator.sh every day at BACKUP_HOUR UTC.
  # Uses the same prod image plus rclone/bash/jq (already bundled in Dockerfile).
  # Activate with: docker compose --profile backup up -d backup-scheduler
  #
  # Backups land in /data/backups/snapshots/<YYYY-MM-DD>/ (shared volume bodega-backups)
  # and are uploaded to GDRIVE_BACKUPS_DEST via rclone if configured.
  backup-scheduler:
    profiles: ["backup"]
    build:
      context: .
      target: prod
    image: ghcr.io/${GITHUB_REPOSITORY:-chome/bodega}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      migrate:
        condition: service_completed_successfully
      app:
        condition: service_healthy
    environment:
      # Misma zona que `app`: este servicio fecha respaldos y dispara los cron
      # diarios, que se corren contra el calendario chileno.
      - TZ=America/Santiago
      - DATABASE_URL=${DATABASE_URL:-postgres://${POSTGRES_USER:-bodega}:${POSTGRES_PASSWORD:?err}@db:5432/${POSTGRES_DB:-bodega}}
      - STORAGE_PATH=${STORAGE_PATH:-/data/storage}
      - BACKUP_DIR=${BACKUP_DIR:-/data/backups}
      - GDRIVE_BACKUPS_DEST=${GDRIVE_BACKUPS_DEST:-}
      - RETENTION_DAYS=${RETENTION_DAYS:-30}
      # RES-001: base DESECHABLE donde el ensayo semanal restaura el dump del
      # día. Su esquema `public` se destruye en cada ensayo — nunca apuntar a la
      # base de la aplicación. Vacía, el ensayo no corre y `backup-verify.sh`
      # avisa de que nadie ha comprobado que el respaldo se restaure.
      - DRILL_DATABASE_URL=${DRILL_DATABASE_URL:-}
      - RESTORE_DRILL_WEEKDAY=${RESTORE_DRILL_WEEKDAY:-7}
      # Para recoger los documentos SST desde Cloudreve cuando
      # SST_STORAGE_BACKEND=cloudreve: las credenciales del WebDAV (respaldo del
      # .env; las cifradas viven en system_settings y requieren el keyring DTE).
      - SST_STORAGE_BACKEND=${SST_STORAGE_BACKEND:-filesystem}
      - CLOUDREVE_BASE_URL=${CLOUDREVE_BASE_URL:-}
      - CLOUDREVE_USERNAME=${CLOUDREVE_USERNAME:-}
      - CLOUDREVE_PASSWORD=${CLOUDREVE_PASSWORD:-}
      - CLOUDREVE_REQUEST_TIMEOUT_MS=${CLOUDREVE_REQUEST_TIMEOUT_MS:-}
      - CLOUDREVE_SST_PATH=${CLOUDREVE_SST_PATH:-}
      - DTE_SETTINGS_KEYRING=${DTE_SETTINGS_KEYRING:-}
      - DTE_SETTINGS_ACTIVE_KEY_ID=${DTE_SETTINGS_ACTIVE_KEY_ID:-}
      - DTE_SETTINGS_MODE=${DTE_SETTINGS_MODE:-compat}
      # Passthrough, nunca un valor literal: es la llave con la que
      # backup-orchestrator.sh cifra el snapshot antes de subirlo a Drive. Sin
      # ella acá el respaldo sube EN CLARO aunque el host la tenga configurada
      # —con el keyring DTE dentro del mismo tar— y nadie se entera. Está
      # deliberadamente fuera de ENV_WHITELIST: no viaja dentro de lo que cifra.
      - BACKUP_ENCRYPTION_PASSPHRASE=${BACKUP_ENCRYPTION_PASSPHRASE:-}
      - APP_URL=http://app:3000
      - CRON_SECRET=${CRON_SECRET:-}
      - APP_VERSION=${APP_VERSION:-}
      - NODE_ENV=production
      - HOME=/app
      - RCLONE_CONFIG=${RCLONE_CONFIG:-/app/.config/rclone/rclone.conf}
    volumes:
      - bodega-storage:/data/storage:ro
      # Mismo montaje que `app`: el scheduler escribe en /data/backups y debe
      # ver exactamente los mismos archivos que la app (y que BACKUP_HOST_PATH
      # apunte al mismo destino en ambos).
      - ${BACKUP_HOST_PATH:-bodega-backups}:/data/backups
    command: ["bash", "/app/scripts/backup-scheduler.sh"]

  # Scheduler de los endpoints /api/cron/*.
  #
  # Por qué vive DENTRO de la red de Docker y no en GitHub Actions: la entrada
  # pública es un túnel de Cloudflare, que corta la respuesta del origen a los
  # 100 s (error 524) y no es configurable fuera de Enterprise. Una corrida de
  # `dte-portal-sync` a fin de mes se acerca a eso — la Bandeja de Entrada tarda
  # ~80 s con 681 documentos y el cliente fija su propio timeout en 120 s
  # (lib/services/dte-portal/config.ts). Pegándole a `http://app:3000` no hay
  # proxy de por medio y el límite desaparece.
  #
  # Por qué `user: "0:0"`: la imagen corre como `nextjs` (uid 1001), y el crond
  # de busybox arranca sin root pero NO ejecuta los trabajos (necesita setuid al
  # dueño del crontab). Verificado: como nextjs el job nunca corre. Este
  # contenedor no publica puertos ni monta volúmenes; sólo ejecuta el runner
  # Node interno (sin pasar URL, respuesta o token a la salida del shell).
  #
  # El crontab se escribe al arrancar en vez de venir en la imagen para que los
  # horarios se cambien acá, versionados, sin reconstruir ni volver a publicar.
  # CRON_SECRET se materializa sólo en el crontab al arrancar porque busybox
  # crond no propaga el entorno del contenedor a los trabajos. El runner nunca
  # lo imprime y el keyring DTE jamás se inyecta en este servicio.
  #
  # El montaje de /usr/share/zoneinfo NO es decorativo: la imagen no trae tzdata.
  # Node resuelve America/Santiago por ICU (por eso `app` no lo necesita), pero
  # busybox usa los archivos de musl y sin ellos cae a UTC — crond habría
  # programado estos horarios en UTC, corriendo las 07:00 a las 03:00 de Chile.
  # Montarlo desde el host además trae los cambios de horario de verano.
  cron:
    image: ghcr.io/${GITHUB_REPOSITORY:-chome/bodega}:${IMAGE_TAG:-latest}
    restart: unless-stopped
    user: "0:0"
    depends_on:
      app:
        condition: service_healthy
    environment:
      - TZ=America/Santiago
      - CRON_SECRET=${CRON_SECRET:-}
    volumes:
      - /usr/share/zoneinfo:/usr/share/zoneinfo:ro
    entrypoint: ["sh", "-c"]
    command:
      - |
        set -eu
        # Sin secreto los trabajos sólo cosecharían 401 en silencio: mejor que
        # el contenedor no arranque y se vea en `docker compose ps`.
        if [ -z "$$CRON_SECRET" ]; then
          echo "[cron] ERROR: CRON_SECRET vacío. Revisa el .env de producción." >&2
          exit 1
        fi
        cat > /etc/crontabs/root <<EOF
        # Compras DTE — 07:00, 13:00 y 19:00 (America/Santiago).
        # Cada corrida baja el mes completo: el portal sólo filtra por mes/año,
        # no por día (lib/services/dte-portal/bandeja-entrada.ts). Por eso son
        # 3 al día y no una por hora.
        0 7,13,19 * * * CRON_SECRET="$$CRON_SECRET" node /app/scripts/cron-runner.mjs dte >/proc/1/fd/1 2>&1
        # Ventas — una vez al día, desfasada del primer run de compras para no
        # abrir dos sesiones simultáneas contra el mismo portal.
        30 7 * * * CRON_SECRET="$$CRON_SECRET" node /app/scripts/cron-runner.mjs sales >/proc/1/fd/1 2>&1
        # Chipax — ventas del mes actual/anterior y cartolas del mes actual,
        # una vez al día a las 09:00 America/Santiago.
        0 9 * * * CRON_SECRET="$$CRON_SECRET" node /app/scripts/cron-runner.mjs chipax >/proc/1/fd/1 2>&1
        # Liveness de crond y conectividad/auth contra el evaluador. Un estado
        # DTE degradado responde 200 y alerta; no debe reiniciar el scheduler.
        */5 * * * * CRON_SECRET="$$CRON_SECRET" node /app/scripts/cron-runner.mjs health >/proc/1/fd/1 2>&1
        # Combustibles — CO-029/CO-039: estos tres crons existían pero no
        # corrían en ningún lado (ni acá ni en GitHub Actions). Horarios
        # desfasados de los de DTE/ventas/Chipax de arriba para no competir
        # por el mismo portal ni la misma ventana de I/O.
        0 5 * * * CRON_SECRET="$$CRON_SECRET" node /app/scripts/cron-runner.mjs fuel-anomaly-detection >/proc/1/fd/1 2>&1
        30 5 * * * CRON_SECRET="$$CRON_SECRET" node /app/scripts/cron-runner.mjs fuel-copec-sync >/proc/1/fd/1 2>&1
        45 5 * * * CRON_SECRET="$$CRON_SECRET" node /app/scripts/cron-runner.mjs fuel-aramco-sync >/proc/1/fd/1 2>&1
        30 8 * * * CRON_SECRET="$$CRON_SECRET" node /app/scripts/cron-runner.mjs fuel-statement-notifications >/proc/1/fd/1 2>&1
        # Flota GPS — refresco cada 5 minutos. La app reutiliza una sesión
        # Auth0 en memoria para no autenticar contra OnWay en cada ejecución.
        */5 * * * * CRON_SECRET="$$CRON_SECRET" node /app/scripts/cron-runner.mjs fleet-onway-sync >/proc/1/fd/1 2>&1
        # GPS OnWay — retención diaria de puntos y coordenadas detalladas.
        20 4 * * * CRON_SECRET="$$CRON_SECRET" node /app/scripts/cron-runner.mjs fleet-onway-retention >/proc/1/fd/1 2>&1
        # Mantenciones — SLA y escalamiento antes del inicio de la jornada.
        0 6 * * * CRON_SECRET="$$CRON_SECRET" node /app/scripts/cron-runner.mjs maintenance-reminders >/proc/1/fd/1 2>&1
        # Soporte — alerta diaria a gestores por tickets próximos a vencer o fuera de SLA.
        15 6 * * * CRON_SECRET="$$CRON_SECRET" node /app/scripts/cron-runner.mjs feedback-sla-reminders >/proc/1/fd/1 2>&1
        # TI — alertas diarias: garantías por vencer, licencias por renovar,
        # reparaciones demoradas y tickets sin actualización.
        45 6 * * * CRON_SECRET="$$CRON_SECRET" node /app/scripts/cron-runner.mjs ti-alerts >/proc/1/fd/1 2>&1
        # Integridad operacional — 05:30, antes de que empiece la jornada, para
        # que los descuadres del día anterior estén en la mesa cuando alguien
        # abra trazabilidad. Sólo observa: no cierra casos ni toca stock. Va
        # temprano y solo porque el detector de compras reconcilia cada OC viva.
        30 5 * * * CRON_SECRET="$$CRON_SECRET" node /app/scripts/cron-runner.mjs operational-integrity-scan >/proc/1/fd/1 2>&1
        EOF
        # Si el montaje de zoneinfo se rompe, esto lo delata: debe decir -04 o
        # -03, nunca UTC. Los horarios de abajo se leen contra esta hora.
        echo "[cron] hora local del scheduler: $$(date)"
        echo "[cron] horarios cargados:"
        sed -E 's/(CRON_SECRET=)[^[:space:]]+/\1***/' /etc/crontabs/root
        exec crond -f -l 8
    healthcheck:
      test: ["CMD-SHELL", "pgrep crond >/dev/null && CRON_SECRET=$$CRON_SECRET node /app/scripts/cron-runner.mjs health >/dev/null 2>&1"]
      interval: 5m
      timeout: 30s
      retries: 2
      start_period: 30s

  # One-shot: applies Drizzle migrations and then idempotently regularizes the
  # historical EPP scale defect before the application starts.
  migrate:
    build:
      context: .
      target: prod
    image: ghcr.io/${GITHUB_REPOSITORY:-chome/bodega}:${IMAGE_TAG:-latest}
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgres://${POSTGRES_USER:-bodega}:${POSTGRES_PASSWORD:?err}@db:5432/${POSTGRES_DB:-bodega}}
    command: ["sh", "-c", "node scripts/migrate.mjs && node scripts/reconcile-epp-delivery-scale.mjs --apply"]

  # One-shot: sync RBAC permissions from module manifests to the database.
  # Run automatically by deploy-prod.sh after migrations. Also run manually:
  #   docker compose run --rm sync-rbac
  # Reuses the same prod image. The synchronizer is bundled during the Docker
  # build, so it does not depend on TypeScript source files at runtime.
  sync-rbac:
    build:
      context: .
      target: prod
    image: ghcr.io/${GITHUB_REPOSITORY:-chome/bodega}:${IMAGE_TAG:-latest}
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:-postgres://${POSTGRES_USER:-bodega}:${POSTGRES_PASSWORD:?err}@db:5432/${POSTGRES_DB:-bodega}}
    command: ["node", "scripts/sync-rbac.mjs"]

  # One-shot: normaliza SKUs de productos EPP y servicios a formato secuencial
  # (EPP-001, EPP-002, ... / SRV-001, SRV-002, ...). Conserva los SKU de
  # productos fuera del conjunto activo, por lo que puede dejar saltos. Es
  # idempotente: si ya está normalizado, no cambia nada. Corre después de
  # migraciones.
  #
  #   docker compose run --rm normalize-epp-skus
  #
  normalize-epp-skus:
    build:
      context: .
      target: prod
    image: ghcr.io/${GITHUB_REPOSITORY:-chome/bodega}:${IMAGE_TAG:-latest}
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:-postgres://${POSTGRES_USER:-bodega}:${POSTGRES_PASSWORD:?err}@db:5432/${POSTGRES_DB:-bodega}}
    command: ["node", "scripts/normalize-epp-skus.mjs", "--apply"]

  # One-shot: completa XS/S/M/L/XL/2XL en toda familia EPP del catálogo que ya
  # usa "Talla" (la escala de ropa: pantalones, buzos, chaquetas, chalecos,
  # trajes...). El importador XLSX y la creación manual sólo dejan la fila que
  # trae la planilla o la que alguien tipeó, no las seis tallas. Idempotente:
  # familias completas o sin esa escala no se tocan. Corre después de
  # normalizar SKUs.
  #
  #   docker compose run --rm backfill-epp-clothing-sizes
  #
  # `--apply` es obligatorio: el script no escribe por omisión porque inventa
  # variantes de catálogo con SKU y proveedor propios. Sin el flag este paso
  # del deploy informaría y no haría nada.
  backfill-epp-clothing-sizes:
    build:
      context: .
      target: prod
    image: ghcr.io/${GITHUB_REPOSITORY:-chome/bodega}:${IMAGE_TAG:-latest}
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:-postgres://${POSTGRES_USER:-bodega}:${POSTGRES_PASSWORD:?err}@db:5432/${POSTGRES_DB:-bodega}}
    command: ["node", "scripts/backfill-epp-clothing-sizes.mjs", "--apply"]

  # One-shot: recalcula el estado derivado de las solicitudes que quedaron con
  # el que calculó una regla de cierre anterior. `purchase_requests.status` es
  # un derivado de sus ítems y el rollup solo lo recalcula cuando un ítem
  # transiciona; una solicitud cuyos ítems ya están todos en estado terminal no
  # tiene ninguna transición pendiente que lo dispare. Idempotente: sin deriva
  # no escribe. `--apply` es obligatorio; sin el flag sólo informa.
  #
  #   docker compose run --rm reconcile-request-status            # informa
  #   docker compose run --rm reconcile-request-status --apply    # recalcula
  #
  reconcile-request-status:
    build:
      context: .
      target: prod
    image: ghcr.io/${GITHUB_REPOSITORY:-chome/bodega}:${IMAGE_TAG:-latest}
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:-postgres://${POSTGRES_USER:-bodega}:${POSTGRES_PASSWORD:?err}@db:5432/${POSTGRES_DB:-bodega}}
    command: ["node", "scripts/reconcile-request-status.mjs", "--apply"]

  # One-shot: deja `size_catalog` al día con la semilla del código. Prerrequisito
  # de los dos pasos de tallas que siguen —el backfill de ropa exige
  # `size_family = 'ropa'`, y esa familia sale de esta tabla—. Idempotente y no
  # destructivo: agrega lo que falta, renumera el orden de cada familia y no
  # reactiva una talla dada de baja a mano.
  #
  #   docker compose run --rm seed-size-catalog
  #
  seed-size-catalog:
    build:
      context: .
      target: prod
    image: ghcr.io/${GITHUB_REPOSITORY:-chome/bodega}:${IMAGE_TAG:-latest}
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:-postgres://${POSTGRES_USER:-bodega}:${POSTGRES_PASSWORD:?err}@db:5432/${POSTGRES_DB:-bodega}}
    command: ["node", "scripts/seed-size-catalog.mjs"]

  # One-shot: da de baja las variantes que son la misma talla física escrita de
  # dos formas (`N41` junto a `T41`, `L` junto a `T/L`) o duplicadas de plano.
  # Desactiva con `is_active = false`, nunca borra, y sólo toca variantes sin
  # stock ni historial — las que participaron de una operación se informan y se
  # saltan, porque trasladar stock y repuntar guías u OC es una decisión
  # contable. `--apply` es obligatorio: sin el flag sólo informa el plan.
  #
  #   docker compose run --rm reconcile-epp-duplicate-sizes            # informa
  #   docker compose run --rm reconcile-epp-duplicate-sizes --apply    # escribe
  #
  reconcile-epp-duplicate-sizes:
    build:
      context: .
      target: prod
    image: ghcr.io/${GITHUB_REPOSITORY:-chome/bodega}:${IMAGE_TAG:-latest}
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:-postgres://${POSTGRES_USER:-bodega}:${POSTGRES_PASSWORD:?err}@db:5432/${POSTGRES_DB:-bodega}}
    command: ["node", "scripts/reconcile-epp-duplicate-sizes.mjs", "--apply"]

  # One-shot: instala el catálogo del motor de inspecciones cableado a las
  # actividades del PDTP que acredita cada instrumento. Idempotente: la
  # identidad es (code, versionLabel), así que repetirlo no crea versiones —
  # sólo corrige el cableado de una plantilla que quedó sin acreditar.
  #
  #   docker compose run --rm seed-inspection-templates
  #
  # Sin SEED_ACTOR_USER_ID resuelve el primer usuario con rol `administrador`:
  # `author_user_id` es FK obligatoria. Corre DESPUÉS de migrate y de sync-rbac.
  seed-inspection-templates:
    build:
      context: .
      target: prod
    image: ghcr.io/${GITHUB_REPOSITORY:-chome/bodega}:${IMAGE_TAG:-latest}
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:-postgres://${POSTGRES_USER:-bodega}:${POSTGRES_PASSWORD:?err}@db:5432/${POSTGRES_DB:-bodega}}
      - SEED_ACTOR_USER_ID=${SEED_ACTOR_USER_ID:-}
      - SEED_DRY_RUN=${SEED_DRY_RUN:-}
    command: ["node", "scripts/seed-pdtp-inspection-templates.mjs"]

  # One-shot: siembra categorías y tipos de Documentación SST, incluido el
  # cableado de la N°43 (al publicar) y la N°36 (por acuse). Idempotente por
  # (categoría, código).
  #
  #   docker compose run --rm apply-sst-taxonomy
  apply-sst-taxonomy:
    build:
      context: .
      target: prod
    image: ghcr.io/${GITHUB_REPOSITORY:-chome/bodega}:${IMAGE_TAG:-latest}
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:-postgres://${POSTGRES_USER:-bodega}:${POSTGRES_PASSWORD:?err}@db:5432/${POSTGRES_DB:-bodega}}
      - SST_TAXONOMY_DRY_RUN=${SST_TAXONOMY_DRY_RUN:-}
      - SST_TAXONOMY_DEPLOY_MODE=true
    command: ["node", "scripts/apply-sst-document-taxonomy.mjs"]

  # One-shot: un plan de emergencia en borrador por faena activa, con sus
  # amenazas obligatorias y su organigrama mínimo. No aprueba nada.
  #
  #   docker compose run --rm seed-emergency-plans
  seed-emergency-plans:
    build:
      context: .
      target: prod
    image: ghcr.io/${GITHUB_REPOSITORY:-chome/bodega}:${IMAGE_TAG:-latest}
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:-postgres://${POSTGRES_USER:-bodega}:${POSTGRES_PASSWORD:?err}@db:5432/${POSTGRES_DB:-bodega}}
      - EMERGENCY_PLANS_ACTOR_USER_ID=${EMERGENCY_PLANS_ACTOR_USER_ID:-}
      - EMERGENCY_PLANS_DRY_RUN=${EMERGENCY_PLANS_DRY_RUN:-}
      - EMERGENCY_PLANS_DEPLOY_MODE=true
    command: ["node", "scripts/seed-emergency-plans.cjs"]

  # One-shot de sólo lectura: qué actividades del programa no tienen un
  # instrumento vigente que las acredite, y qué plantillas vigentes se están
  # ejecutando sin declarar ninguna. Nunca sale con error — es un informe.
  #
  #   docker compose run --rm preflight-pdtp-wiring
  # Cierra a mano lo que el sembrador deja en borrador a propósito: aprueba las
  # plantillas que faltan y retira las vigentes que no declaran ninguna
  # actividad. NO va en el deploy —aprobar es un acto firmado— y por eso exige
  # APPROVE_ACTOR_USER_ID explícito:
  #   APPROVE_DRY_RUN=true APPROVE_ACTOR_USER_ID=<id> docker compose run --rm approve-inspection-templates
  approve-inspection-templates:
    build:
      context: .
      target: prod
    image: ghcr.io/${GITHUB_REPOSITORY:-chome/bodega}:${IMAGE_TAG:-latest}
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:-postgres://${POSTGRES_USER:-bodega}:${POSTGRES_PASSWORD:?err}@db:5432/${POSTGRES_DB:-bodega}}
      - APPROVE_ACTOR_USER_ID=${APPROVE_ACTOR_USER_ID:-}
      - APPROVE_DRY_RUN=${APPROVE_DRY_RUN:-}
    command: ["node", "scripts/approve-pdtp-inspection-templates.mjs"]

  # Corrige la clasificación de los cursos específicos (extintores, EPP,
  # Coordinador GRD) que quedaron declarados como del art. 16 del DS 44. NO va
  # en el deploy —queda constancia con nombre y fecha— y exige actor explícito:
  #   RECLASSIFY_DRY_RUN=true RECLASSIFY_ACTOR_USER_ID=<id> docker compose run --rm reclassify-specific-courses
  reclassify-specific-courses:
    build:
      context: .
      target: prod
    image: ghcr.io/${GITHUB_REPOSITORY:-chome/bodega}:${IMAGE_TAG:-latest}
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:-postgres://${POSTGRES_USER:-bodega}:${POSTGRES_PASSWORD:?err}@db:5432/${POSTGRES_DB:-bodega}}
      - RECLASSIFY_ACTOR_USER_ID=${RECLASSIFY_ACTOR_USER_ID:-}
      - RECLASSIFY_DRY_RUN=${RECLASSIFY_DRY_RUN:-}
    command: ["node", "scripts/reclassify-pdtp-specific-courses.mjs"]

  # Carga en borrador el temario de los cursos con contenido documentado. El
  # actor queda como AUTOR y por eso no podrá aprobarlo después: la segregación
  # lo impide, así que conviene elegir a alguien distinto de quien vaya a firmar.
  #   SEED_VERSIONS_DRY_RUN=true SEED_VERSIONS_ACTOR_USER_ID=<id> docker compose run --rm seed-course-versions
  seed-course-versions:
    build:
      context: .
      target: prod
    image: ghcr.io/${GITHUB_REPOSITORY:-chome/bodega}:${IMAGE_TAG:-latest}
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:-postgres://${POSTGRES_USER:-bodega}:${POSTGRES_PASSWORD:?err}@db:5432/${POSTGRES_DB:-bodega}}
      - SEED_VERSIONS_ACTOR_USER_ID=${SEED_VERSIONS_ACTOR_USER_ID:-}
      - SEED_VERSIONS_DRY_RUN=${SEED_VERSIONS_DRY_RUN:-}
    command: ["node", "scripts/seed-pdtp-course-versions.mjs"]

  # Retira las plantillas habilitadas por quien no correspondía. Entre este paso
  # y la nueva aprobación NO hay ninguna plantilla vigente y nadie puede ejecutar
  # una inspección: correlo con la persona que va a firmar disponible.
  #   RESIGN_DRY_RUN=true RESIGN_ACTOR_USER_ID=<id> RESIGN_APPROVED_BY_USER_ID=<id> \
  #     docker compose run --rm resign-inspection-templates
  resign-inspection-templates:
    build:
      context: .
      target: prod
    image: ghcr.io/${GITHUB_REPOSITORY:-chome/bodega}:${IMAGE_TAG:-latest}
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:-postgres://${POSTGRES_USER:-bodega}:${POSTGRES_PASSWORD:?err}@db:5432/${POSTGRES_DB:-bodega}}
      - RESIGN_ACTOR_USER_ID=${RESIGN_ACTOR_USER_ID:-}
      - RESIGN_APPROVED_BY_USER_ID=${RESIGN_APPROVED_BY_USER_ID:-}
      - RESIGN_DRY_RUN=${RESIGN_DRY_RUN:-}
    command: ["node", "scripts/resign-pdtp-inspection-templates.mjs"]

  preflight-pdtp-wiring:
    build:
      context: .
      target: prod
    image: ghcr.io/${GITHUB_REPOSITORY:-chome/bodega}:${IMAGE_TAG:-latest}
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:-postgres://${POSTGRES_USER:-bodega}:${POSTGRES_PASSWORD:?err}@db:5432/${POSTGRES_DB:-bodega}}
    command: ["node", "scripts/preflight-pdtp-accreditation-wiring.mjs"]

  # One-shot: aplica al programa PDTP 2026 las decisiones de catálogo de la
  # jefatura de prevención (retiros, corresponsables, textos y modo de
  # indicador). Corre en cada deploy y es idempotente por ítem: lo ya aplicado
  # se omite. `PDTP_DECISIONS_DEPLOY_MODE` evita que el despliegue aborte cuando
  # el programa del año todavía no existe, no hay administrador, o el programa
  # ya está firmado y cerrado a ediciones.
  apply-pdtp-catalog-decisions:
    build:
      context: .
      target: prod
    image: ghcr.io/${GITHUB_REPOSITORY:-chome/bodega}:${IMAGE_TAG:-latest}
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:-postgres://${POSTGRES_USER:-bodega}:${POSTGRES_PASSWORD:?err}@db:5432/${POSTGRES_DB:-bodega}}
      - PDTP_DECISIONS_DEPLOY_MODE=true
      - PDTP_DECISIONS_ACTOR_USER_ID=${PDTP_DECISIONS_ACTOR_USER_ID:-}
      - PDTP_DECISIONS_DRY_RUN=${PDTP_DECISIONS_DRY_RUN:-}
    command: ["node", "scripts/apply-pdtp-catalog-decisions.mjs"]

  # One-shot: declara qué faenas operan el programa PDTP 2026
  # (`pdtp_program_worksites`) y qué actividades no aplican dentro de las que sí
  # lo operan (`pdtp_activity_worksite_exclusions`). Idempotente: reejecutar no
  # cambia nada si la membresía y las exclusiones ya coinciden con lo declarado
  # en el script. `PDTP_WORKSITE_SCOPE_DEPLOY_MODE` evita que el despliegue
  # aborte cuando el programa del año todavía no existe, no hay administrador,
  # o el programa ya está firmado y cerrado a ediciones.
  apply-pdtp-worksite-scope:
    build:
      context: .
      target: prod
    image: ghcr.io/${GITHUB_REPOSITORY:-chome/bodega}:${IMAGE_TAG:-latest}
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:-postgres://${POSTGRES_USER:-bodega}:${POSTGRES_PASSWORD:?err}@db:5432/${POSTGRES_DB:-bodega}}
      - PDTP_WORKSITE_SCOPE_DEPLOY_MODE=true
      - PDTP_WORKSITE_SCOPE_ACTOR_USER_ID=${PDTP_WORKSITE_SCOPE_ACTOR_USER_ID:-}
      - PDTP_WORKSITE_SCOPE_DRY_RUN=${PDTP_WORKSITE_SCOPE_DRY_RUN:-}
    command: ["node", "scripts/apply-pdtp-worksite-scope.mjs"]

  # One-shot: declara en cursos, planes de emergencia y campañas qué actividad
  # del PDTP acredita cada uno. Idempotente por el `code` de cada registro.
  apply-pdtp-program-data:
    build:
      context: .
      target: prod
    image: ghcr.io/${GITHUB_REPOSITORY:-chome/bodega}:${IMAGE_TAG:-latest}
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:-postgres://${POSTGRES_USER:-bodega}:${POSTGRES_PASSWORD:?err}@db:5432/${POSTGRES_DB:-bodega}}
      - PDTP_PROGRAM_DATA_DEPLOY_MODE=true
      - PDTP_PROGRAM_DATA_ACTOR_USER_ID=${PDTP_PROGRAM_DATA_ACTOR_USER_ID:-}
      - PDTP_PROGRAM_DATA_DRY_RUN=${PDTP_PROGRAM_DATA_DRY_RUN:-}
    command: ["node", "scripts/apply-pdtp-program-data.mjs"]

  # One-shot: clasifica cada actividad activa por mecanismo de acreditación
  # (enganche / constancia / compuesta). Idempotente por el número de actividad.
  apply-pdtp-mechanisms:
    build:
      context: .
      target: prod
    image: ghcr.io/${GITHUB_REPOSITORY:-chome/bodega}:${IMAGE_TAG:-latest}
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:-postgres://${POSTGRES_USER:-bodega}:${POSTGRES_PASSWORD:?err}@db:5432/${POSTGRES_DB:-bodega}}
      - PDTP_MECHANISMS_DEPLOY_MODE=true
      - PDTP_MECHANISMS_DRY_RUN=${PDTP_MECHANISMS_DRY_RUN:-}
    command: ["node", "scripts/apply-pdtp-mechanisms.mjs"]

  # One-shot: SLA y evidencia mínima de las actividades a demanda del programa.
  # Sin esto no se puede ni enviar el programa a revisión. Idempotente por
  # actividad.
  apply-pdtp-demand-slas:
    build:
      context: .
      target: prod
    image: ghcr.io/${GITHUB_REPOSITORY:-chome/bodega}:${IMAGE_TAG:-latest}
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:-postgres://${POSTGRES_USER:-bodega}:${POSTGRES_PASSWORD:?err}@db:5432/${POSTGRES_DB:-bodega}}
      - PDTP_DEMAND_SLAS_DEPLOY_MODE=true
      - PDTP_DEMAND_SLAS_DRY_RUN=${PDTP_DEMAND_SLAS_DRY_RUN:-}
    command: ["node", "scripts/apply-pdtp-demand-slas.mjs"]

  # One-shot: reprocesa los eventos de cumplimiento PDTP que quedaron
  # pending/error (programa que se activó después del hecho, mapeo corregido).
  # Idempotente por idempotency_key.
  reconcile-pdtp-fulfillment-events:
    build:
      context: .
      target: prod
    image: ghcr.io/${GITHUB_REPOSITORY:-chome/bodega}:${IMAGE_TAG:-latest}
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:-postgres://${POSTGRES_USER:-bodega}:${POSTGRES_PASSWORD:?err}@db:5432/${POSTGRES_DB:-bodega}}
      - PDTP_RECONCILE_LIMIT=${PDTP_RECONCILE_LIMIT:-}
    command: ["node", "scripts/reconcile-pdtp-fulfillment-events.cjs"]

  # One-shot: diagnóstico READ ONLY de la conciliación OC-factura. No depende de
  # las columnas de proyección, así que deploy-prod.sh lo corre ANTES de migrar
  # para dejar registrado cuánta deriva traía la base. Nunca falla por hallazgos:
  # imprime los conteos y sale 0.
  preflight-invoice-reconciliation:
    build:
      context: .
      target: prod
    image: ghcr.io/${GITHUB_REPOSITORY:-chome/bodega}:${IMAGE_TAG:-latest}
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:-postgres://${POSTGRES_USER:-bodega}:${POSTGRES_PASSWORD:?err}@db:5432/${POSTGRES_DB:-bodega}}
    command: ["node", "scripts/preflight-purchase-invoice-reconciliation.mjs"]

  # One-shot: recalcula la proyección de conciliación de toda OC con factura.
  # Incluye huellas de versiones anteriores; el resultado se deriva de la
  # evidencia. Idempotente (el estado se
  # deriva de la evidencia y de la tabla de revisiones, no de la proyección),
  # pero toma FOR UPDATE sobre todas esas OC en una sola transacción: correrlo
  # de más es una ventana de bloqueo gratis, por eso deploy-prod.sh lo condiciona
  # a que queden filas sin fingerprint.
  backfill-invoice-reconciliation:
    build:
      context: .
      target: prod
    image: ghcr.io/${GITHUB_REPOSITORY:-chome/bodega}:${IMAGE_TAG:-latest}
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:-postgres://${POSTGRES_USER:-bodega}:${POSTGRES_PASSWORD:?err}@db:5432/${POSTGRES_DB:-bodega}}
    command: ["node", "scripts/backfill-purchase-invoice-reconciliation.mjs"]

  # One-shot: rellena `referenced_order_codes` en los DTE sincronizados antes de
  # que existiera la columna, releyendo el XML ya cacheado en disco. Es lo que
  # enciende la señal "el proveedor cita esta OC" para el histórico; sin esto
  # sólo la tendrían los documentos que lleguen después del deploy.
  #
  # NO sale al portal y NO toca el estado de enriquecimiento (ver la cabecera
  # del script). Idempotente, así que deploy-prod.sh lo condiciona sólo para
  # ahorrarse la pasada, no por riesgo de repetirlo.
  #
  # Monta el volumen de storage en sólo lectura: su trabajo es leer XML y
  # escribir una columna.
  #
  #   docker compose run --rm backfill-dte-order-refs
  backfill-dte-order-refs:
    build:
      context: .
      target: prod
    image: ghcr.io/${GITHUB_REPOSITORY:-chome/bodega}:${IMAGE_TAG:-latest}
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:-postgres://${POSTGRES_USER:-bodega}:${POSTGRES_PASSWORD:?err}@db:5432/${POSTGRES_DB:-bodega}}
      - STORAGE_PATH=${STORAGE_PATH:-/data/storage}
    volumes:
      - bodega-storage:/data/storage:ro
    command: ["node", "scripts/backfill-dte-order-refs.mjs"]

  # One-shot idempotente: relee `referenced_order_codes` desde el XML en disco
  # para las filas que YA se examinaron con el normalizador anterior, el que
  # descartaba los correlativos de 2 dígitos ("26", "17"). El backfill de arriba
  # no las alcanza porque sólo mira filas en NULL.
  #
  # Sólo escribe cuando el valor cambia; una segunda corrida no toca nada.
  #
  #   docker compose run --rm reparse-dte-order-refs
  reparse-dte-order-refs:
    build:
      context: .
      target: prod
    image: ghcr.io/${GITHUB_REPOSITORY:-chome/bodega}:${IMAGE_TAG:-latest}
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:-postgres://${POSTGRES_USER:-bodega}:${POSTGRES_PASSWORD:?err}@db:5432/${POSTGRES_DB:-bodega}}
      - STORAGE_PATH=${STORAGE_PATH:-/data/storage}
    volumes:
      - bodega-storage:/data/storage:ro
    command: ["node", "scripts/reparse-dte-order-refs.mjs"]

  # One-shot idempotente: `deploy:prod` lo ejecuta automáticamente y también
  # puede invocarse a demanda. Migra los documentos SST del filesystem local a
  # Cloudreve (WebDAV) y verifica SHA-256 contra
  # `sstDocumentVersions.checksum` y NO borra el origen local (rollback =
  # volver SST_STORAGE_BACKEND a filesystem).
  #
  # Requiere las credenciales de Cloudreve: vienen del .env del host
  # (CLOUDREVE_*) y/o de system_settings cifradas con el keyring DTE, así que
  # este servicio recibe también el keyring igual que `app`.
  #
  #   docker compose run --rm migrate-sst-to-cloudreve
  migrate-sst-to-cloudreve:
    build:
      context: .
      target: prod
    image: ghcr.io/${GITHUB_REPOSITORY:-chome/bodega}:${IMAGE_TAG:-latest}
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:-postgres://${POSTGRES_USER:-bodega}:${POSTGRES_PASSWORD:?err}@db:5432/${POSTGRES_DB:-bodega}}
      - STORAGE_PATH=${STORAGE_PATH:-/data/storage}
      - CLOUDREVE_BASE_URL=${CLOUDREVE_BASE_URL:-}
      - CLOUDREVE_USERNAME=${CLOUDREVE_USERNAME:-}
      - CLOUDREVE_PASSWORD=${CLOUDREVE_PASSWORD:-}
      - CLOUDREVE_REQUEST_TIMEOUT_MS=${CLOUDREVE_REQUEST_TIMEOUT_MS:-}
      - CLOUDREVE_SST_PATH=${CLOUDREVE_SST_PATH:-}
      - DTE_SETTINGS_KEYRING=${DTE_SETTINGS_KEYRING:-}
      - DTE_SETTINGS_ACTIVE_KEY_ID=${DTE_SETTINGS_ACTIVE_KEY_ID:-}
      - DTE_SETTINGS_MODE=${DTE_SETTINGS_MODE:-compat}
    volumes:
      - bodega-storage:/data/storage:ro
    command: ["node", "scripts/migrate-sst-to-cloudreve.cjs"]

  # One-shot de sólo lectura: dimensiona el rescate del detalle de combustible
  # (odómetro por transacción) y la deriva del ledger. No escribe nada — la
  # garantía está en `sql.begin("read only", ...)`, no en la convención.
  #
  #   docker compose run --rm preflight-fuel-integrations
  preflight-fuel-integrations:
    build:
      context: .
      target: prod
    image: ghcr.io/${GITHUB_REPOSITORY:-chome/bodega}:${IMAGE_TAG:-latest}
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:-postgres://${POSTGRES_USER:-bodega}:${POSTGRES_PASSWORD:?err}@db:5432/${POSTGRES_DB:-bodega}}
    command: ["node", "scripts/preflight-fuel-integrations.mjs"]

  # One-shot: reconstruye `fuel_meter_readings` desde el detalle por transacción
  # que Copec y Aramco ya dejaron en `fuel_consumption_records.raw_row`. No sale
  # al portal ni consume cuota de proveedor. Idempotente por (fuente, guía).
  #
  #   docker compose run --rm backfill-fuel-meter-readings
  backfill-fuel-meter-readings:
    build:
      context: .
      target: prod
    image: ghcr.io/${GITHUB_REPOSITORY:-chome/bodega}:${IMAGE_TAG:-latest}
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:-postgres://${POSTGRES_USER:-bodega}:${POSTGRES_PASSWORD:?err}@db:5432/${POSTGRES_DB:-bodega}}
    command: ["node", "scripts/backfill-fuel-meter-readings.mjs"]

  # One-shot: deja el catálogo de reglas de anomalía al día. Sin esto, una regla
  # nueva no existe como fila y su detector no dispara aunque esté en el código.
  # No pisa severidad, config ni activación de las reglas ya presentes.
  #
  #   docker compose run --rm seed-fuel-anomaly-rules
  seed-fuel-anomaly-rules:
    build:
      context: .
      target: prod
    image: ghcr.io/${GITHUB_REPOSITORY:-chome/bodega}:${IMAGE_TAG:-latest}
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:-postgres://${POSTGRES_USER:-bodega}:${POSTGRES_PASSWORD:?err}@db:5432/${POSTGRES_DB:-bodega}}
    command: ["node", "scripts/seed-fuel-anomaly-rules.mjs"]

  # One-shot, MANUAL y previo a volver al código anterior: traduce los estados
  # nuevos a `needs_review`. No elimina facturas, recepciones ni vínculos.
  prepare-rollback-invoice-reconciliation:
    build:
      context: .
      target: prod
    image: ghcr.io/${GITHUB_REPOSITORY:-chome/bodega}:${IMAGE_TAG:-latest}
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:-postgres://${POSTGRES_USER:-bodega}:${POSTGRES_PASSWORD:?err}@db:5432/${POSTGRES_DB:-bodega}}
    command: ["node", "scripts/rollback-purchase-invoice-reconciliation-statuses.mjs"]

  # One-shot, MANUAL: Bootstrap Base Preventiva 2026 (PDTP).
  # Corre solo cuando se necesita publicar o actualizar la base normativa.
  #   docker compose run --rm bootstrap-pdtp
  #
  # Variables de entorno opcionales:
  #   PUBLISH_REFERENCE=true  — publica la revisión inmutable (necesaria la primera vez)
  #   BOOTSTRAP_USER_ID=<id>  — UUID del usuario admin global
  #   BOOTSTRAP_XLSX_PATH=/app/PROGRAMA_ACTIVIDADES_DEFINITIVO.xlsx  — ruta al XLSX
  #
  # Usa `target: build` para tener tsx, exceljs y todo el source disponible.
  bootstrap-pdtp:
    profiles: ["bootstrap"]
    build:
      context: .
      target: build
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:-postgres://${POSTGRES_USER:-bodega}:${POSTGRES_PASSWORD:?err}@db:5432/${POSTGRES_DB:-bodega}}
      - BOOTSTRAP_XLSX_PATH=${BOOTSTRAP_XLSX_PATH:-/app/PROGRAMA_ACTIVIDADES_DEFINITIVO.xlsx}
      - BOOTSTRAP_USER_ID=${BOOTSTRAP_USER_ID:-}
      - PUBLISH_REFERENCE=${PUBLISH_REFERENCE:-true}
    command: ["npx", "tsx", "scripts/pdtp-bootstrap-prod.ts"]

  # One-shot, MANUAL: bootstrap seed (worksites/workers and EPP catalog).
  # Not part of the default `up` (guarded by the `seed` profile). Run explicitly:
  #   docker compose run --rm seed
  # Uses the `build` stage — not `prod` — because db/seed.ts needs the TypeScript
  # source, db/schema, lib/ and the `tsx` devDependency that the slim prod image
  # deliberately omits.
  seed:
    profiles: ["seed"]
    build:
      context: .
      target: build
    restart: "no"
    depends_on:
      db:
        condition: service_healthy
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${DATABASE_URL:-postgres://${POSTGRES_USER:-bodega}:${POSTGRES_PASSWORD:?err}@db:5432/${POSTGRES_DB:-bodega}}
    command: ["npx", "tsx", "db/seed.ts"]

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-bodega}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?err}
      - POSTGRES_DB=${POSTGRES_DB:-bodega}
    volumes:
      - bodega-db:/var/lib/postgresql/data
    healthcheck:
      # Probe over TCP (-h 127.0.0.1), not the Unix socket: during first-boot
      # initdb runs a temporary socket-only server (listen_addresses=''), so a
      # socket probe would report "healthy" before TCP accepts connections and
      # dependents (migrate/app) would hit ECONNREFUSED on db:5432.
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -p 5432 -U ${POSTGRES_USER:-bodega} -d ${POSTGRES_DB:-bodega}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

volumes:
  bodega-storage:
  # Fuente por defecto del montaje de /data/backups. Cuando BACKUP_HOST_PATH
  # define una ruta absoluta del host, se usa esa en vez de este volumen.
  bodega-backups:
  bodega-db:
