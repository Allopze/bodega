name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bodega_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/bodega_e2e

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check env files
        run: npm run check:secrets

      - name: Security audit — npm audit
        run: npm audit --audit-level=high || echo "npm audit found issues (non-blocking)"

      - name: Verify Drizzle migrations
        run: npm run db:migrate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests (with coverage threshold)
        run: npm run test:coverage

      - name: Concurrency tests (real Postgres)
        env:
          STOCK_CONCURRENCY_DATABASE_URL: postgres://postgres:postgres@localhost:5432/bodega_e2e
          RATE_LIMIT_CONCURRENCY_DATABASE_URL: postgres://postgres:postgres@localhost:5432/bodega_e2e
          STOCK_CONCURRENCY_ALLOW_DESTRUCTIVE_RESET: "true"
          RECEIVING_CONCURRENCY_ALLOW_DESTRUCTIVE_RESET: "true"
          DELIVERIES_CONCURRENCY_ALLOW_DESTRUCTIVE_RESET: "true"
          RATE_LIMIT_CONCURRENCY_ALLOW_DESTRUCTIVE_RESET: "true"
        run: npx vitest run --reporter=verbose lib/__tests__/*concurrency-postgres.test.ts 2>&1

      - name: Build
        run: npm run build

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E smoke (admin + purchase)
        run: npm run test:e2e -- e2e/admin-flow.spec.ts e2e/purchase-flow.spec.ts

      - name: E2E accessibility audit
        run: npm run test:e2e -- e2e/accessibility.spec.ts

  docker-smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build production image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: prod
          load: true
          tags: bodega:ci-test

      - name: Trivy container scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: 'bodega:ci-test'
          format: 'table'
          exit-code: '0'
          ignore-unfixed: true
          vuln-type: 'os,library'
          severity: 'CRITICAL,HIGH'
        continue-on-error: true

      - name: Smoke test — verify image starts and responds
        run: |
          # Start container with minimal env
          docker run -d --name bodega-smoke \
            -e NODE_ENV=production \
            -e DATABASE_URL=postgres://p:px@nonexistent:5432/bodega \
            -e AUTH_SECRET=test-secret-do-not-use-in-prod \
            -e NEXTAUTH_URL=http://localhost:3000 \
            -e STORAGE_PATH=/tmp/storage \
            -p 3000:3000 \
            bodega:ci-test

          # Wait for boot then check /api/health (will fail DB check but should return 500, not crash)
          sleep 5
          curl -sf http://localhost:3000/api/health || echo "Health check exited $? (expected if DB unavailable)"
          docker stop bodega-smoke
