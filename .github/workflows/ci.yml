name: CI

on:
  pull_request:
  push:
    branches:
      - main
      - master

jobs:
  verify:
    runs-on: ubuntu-latest
    # Full E2E suite (~10-16 min) added after build; prior steps run ~10-12 min.
    timeout-minutes: 45
    strategy:
      matrix:
        node-version: [20]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: bodega_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    env:
      DATABASE_URL: postgres://postgres:postgres@localhost:5432/bodega_e2e

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Check env files
        run: npm run check:secrets

      - name: Security audit — npm audit
        run: npm audit --omit=dev --omit=peer --audit-level=high

      - name: Verify Drizzle migrations
        run: npm run db:migrate

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Unit tests (with coverage threshold)
        run: npm run test:coverage

      - name: Concurrency tests (real Postgres)
        env:
          STOCK_CONCURRENCY_DATABASE_URL: postgres://postgres:postgres@localhost:5432/bodega_e2e
          RATE_LIMIT_CONCURRENCY_DATABASE_URL: postgres://postgres:postgres@localhost:5432/bodega_e2e
          APPROVALS_CONCURRENCY_DATABASE_URL: postgres://postgres:postgres@localhost:5432/bodega_e2e
          DELIVERIES_CONCURRENCY_DATABASE_URL: postgres://postgres:postgres@localhost:5432/bodega_e2e
          RECEIVING_CONCURRENCY_DATABASE_URL: postgres://postgres:postgres@localhost:5432/bodega_e2e
          STOCK_CONCURRENCY_ALLOW_DESTRUCTIVE_RESET: "true"
          RECEIVING_CONCURRENCY_ALLOW_DESTRUCTIVE_RESET: "true"
          DELIVERIES_CONCURRENCY_ALLOW_DESTRUCTIVE_RESET: "true"
          RATE_LIMIT_CONCURRENCY_ALLOW_DESTRUCTIVE_RESET: "true"
          APPROVALS_CONCURRENCY_ALLOW_DESTRUCTIVE_RESET: "true"
        run: npx vitest run --reporter=verbose lib/__tests__/*concurrency-postgres.test.ts 2>&1

      - name: Cross-faena scope tests (real Postgres)
        env:
          TRABAJADORES_SCOPE_DATABASE_URL: postgres://postgres:postgres@localhost:5432/bodega_e2e
          COMBUSTIBLES_SCOPE_DATABASE_URL: postgres://postgres:postgres@localhost:5432/bodega_e2e
          QUOTATION_SCOPE_DATABASE_URL: postgres://postgres:postgres@localhost:5432/bodega_e2e
          TRABAJADORES_SCOPE_ALLOW_DESTRUCTIVE_RESET: "true"
          COMBUSTIBLES_SCOPE_ALLOW_DESTRUCTIVE_RESET: "true"
          QUOTATION_SCOPE_ALLOW_DESTRUCTIVE_RESET: "true"
        run: npx vitest run --reporter=verbose lib/__tests__/*scope-postgres.test.ts 2>&1

      # Estas suites son la evidencia principal del cierre P0/P1 de Prevención
      # (CAPA, incidentes, indicadores DS 44, privacidad y MIPER/legal).
      # Hasta el 2026-07-19 no estaban en ningún gate: el glob de
      # los pasos anteriores sólo captura *concurrency-postgres y *scope-postgres,
      # y por eso una regresión real del flujo MIPER de incidentes pasó inadvertida.
      # La config por defecto de vitest usa fileParallelism:false, así que las
      # suites corren en serie y pueden compartir la misma base desechable.
      - name: Prevention domain tests (real Postgres)
        env:
          PREVENTION_CAPA_DATABASE_URL: postgres://postgres:postgres@localhost:5432/bodega_e2e
          PREVENTION_INCIDENTS_DATABASE_URL: postgres://postgres:postgres@localhost:5432/bodega_e2e
          PREVENTION_INDICATORS_DATABASE_URL: postgres://postgres:postgres@localhost:5432/bodega_e2e
          PREVENTION_PRIVACY_DATABASE_URL: postgres://postgres:postgres@localhost:5432/bodega_e2e
          PREVENTION_RISK_DATABASE_URL: postgres://postgres:postgres@localhost:5432/bodega_e2e
          PREVENTION_TRAINING_DATABASE_URL: postgres://postgres:postgres@localhost:5432/bodega_e2e
          PREVENTION_CAPA_ALLOW_DESTRUCTIVE_RESET: "true"
          PREVENTION_INCIDENTS_ALLOW_DESTRUCTIVE_RESET: "true"
          PREVENTION_INDICATORS_ALLOW_DESTRUCTIVE_RESET: "true"
          PREVENTION_PRIVACY_ALLOW_DESTRUCTIVE_RESET: "true"
          PREVENTION_RISK_ALLOW_DESTRUCTIVE_RESET: "true"
          PREVENTION_TRAINING_ALLOW_DESTRUCTIVE_RESET: "true"
        run: npx vitest run --reporter=verbose lib/__tests__/prevention-*-postgres.test.ts 2>&1

      - name: Performance queries (SLO 1000ms)
        env:
          PERF_DATABASE_URL: postgres://postgres:postgres@localhost:5432/bodega_e2e
          PERF_ALLOW_DESTRUCTIVE_RESET: "true"
        run: npm run perf:queries

      - name: Build
        run: npm run build

      - name: Bundle size budget
        run: npm run check:bundle-budget

      - name: Install Playwright browser
        run: npx playwright install --with-deps chromium

      - name: E2E full suite
        run: npx playwright test
