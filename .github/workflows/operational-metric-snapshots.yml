name: Operational metric snapshots

on:
  schedule:
    # 01:15 America/Santiago during standard time; the endpoint is date-aware
    # and the job only needs to run once per calendar day.
    - cron: "15 4 * * *"
  workflow_dispatch:

jobs:
  capture:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Capture daily operational snapshots
        env:
          APP_URL: ${{ secrets.PRODUCTION_APP_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          set -eu
          test -n "$APP_URL"
          test -n "$CRON_SECRET"
          # --fail no cubre las redirecciones: un 3xx sale con código 0 y el job
          # se reporta verde sin haber ejecutado nada. Fue exactamente lo que
          # ocultó durante meses que el proxy mandaba /api/cron/* al login.
          # Se exige 200 explícitamente en vez de confiar en el código de salida.
          status=$(curl --silent --show-error --output /tmp/cron-body.txt \
            --write-out '%{http_code}' \
            --retry 3 --retry-delay 10 \
            -H "Authorization: Bearer ${CRON_SECRET}" \
            "${APP_URL%/}/api/cron/operational-metric-snapshots")
          echo "HTTP ${status}"
          head -c 2000 /tmp/cron-body.txt || true
          echo
          if [ "$status" != "200" ]; then
            echo "::error::El endpoint respondió ${status}, no 200. Un 3xx significa que algo se interpone antes del handler." >&2
            exit 1
          fi
