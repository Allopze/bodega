name: Deploy

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  # Security audit DO-01: apply migrations against the production DB
  # before the new image is rolled out. This prevents the container
  # from booting with a stale schema and serving 500s for every query.
  # The job uses `drizzle-kit migrate` which is idempotent — re-running
  # it on a fresh deploy is a no-op.
  migrate:
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Apply Drizzle migrations
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: npm run db:migrate

  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=
            type=ref,event=branch
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    runs-on: ubuntu-latest
    needs: [migrate, build-and-push]
    environment: production
    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH || '/srv/bodega' }}
            # Save the previous image tag before pulling the new one
            PREVIOUS_TAG=$(docker compose images --format json app 2>/dev/null | tail -1 | grep -o '"Tag":"[^"]*"' | cut -d'"' -f4 || echo "")
            IMAGE_TAG=${{ github.sha }}
            echo "Deploying tag: ${IMAGE_TAG}"
            echo "Previous tag: ${PREVIOUS_TAG}"

            # Pull the specific SHA tag (not latest)
            docker compose pull app --image-tag ${IMAGE_TAG} 2>/dev/null || \
              docker pull ghcr.io/${{ github.repository }}:${IMAGE_TAG}

            # Tag the image so docker-compose picks it up
            docker tag ghcr.io/${{ github.repository }}:${IMAGE_TAG} ghcr.io/${{ github.repository }}:${IMAGE_TAG}-deploy

            docker compose up -d --no-deps app
            sleep 15

            # Health check with rollback on failure
            if curl -sf http://localhost:3000/api/health; then
              echo "Healthcheck passed. Deploy successful."
            else
              echo "Healthcheck failed. Rolling back to previous version..."
              docker compose logs --tail=50 app

              if [ -n "$PREVIOUS_TAG" ] && [ "$PREVIOUS_TAG" != "" ]; then
                docker compose pull app --image-tag ${PREVIOUS_TAG} 2>/dev/null || true
                docker tag ghcr.io/${{ github.repository }}:${PREVIOUS_TAG} ghcr.io/${{ github.repository }}:${PREVIOUS_TAG}-deploy 2>/dev/null || true
                docker compose up -d --no-deps app
                sleep 15
                if curl -sf http://localhost:3000/api/health; then
                  echo "Rollback successful. Container restored to previous version: ${PREVIOUS_TAG}"
                else
                  echo "Rollback also failed. Manual intervention required."
                  docker compose logs --tail=50 app
                  exit 1
                fi
              else
                echo "No previous tag found for rollback. Manual intervention required."
                exit 1
              fi
            fi
