name: Deploy

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches:
      - main
      - master
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  RELEASE_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}

jobs:
  # Security audit DO-01: apply migrations against the production DB
  # before the new image is rolled out. This prevents the container
  # from booting with a stale schema and serving 500s for every query.
  # The job uses `drizzle-kit migrate` which is idempotent — re-running
  # it on a fresh deploy is a no-op.
  migrate:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    needs: build-and-push
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Apply Drizzle migrations
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: |
          npm run db:verify-migrations
          npm run db:migrate

  # Permissions are derived from the registered module manifests rather than
  # from schema migrations. Keep the populated production database in sync
  # whenever a deploy adds or changes a permission grant.
  sync-rbac:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    needs: migrate
    environment: production
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22.13"
          cache: npm

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Synchronize system RBAC
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
        run: npx tsx scripts/sync-rbac.ts

  build-and-push:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=${{ env.RELEASE_SHA }}
            type=raw,value=latest,enable=${{ github.event.workflow_run.head_branch == 'main' || github.ref == 'refs/heads/main' || github.event.workflow_run.head_branch == 'master' || github.ref == 'refs/heads/master' }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          target: prod
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    if: github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    needs: [sync-rbac, build-and-push]
    environment: production
    steps:
      - name: Checkout deployment definition
        uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_SHA }}

      - name: Back up current Compose definition
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH || '/srv/bodega' }}
            if [ -f docker-compose.yml ]; then
              mkdir -p backups
              cp docker-compose.yml "backups/docker-compose-predeploy-${{ env.RELEASE_SHA }}.yml"
            fi

      - name: Sync Compose definition
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: docker-compose.yml
          target: ${{ secrets.DEPLOY_PATH || '/srv/bodega' }}
          overwrite: true

      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            cd ${{ secrets.DEPLOY_PATH || '/srv/bodega' }}
            export GITHUB_REPOSITORY=${{ github.repository }}
            export IMAGE_TAG=${{ env.RELEASE_SHA }}
            # Save the exact image reference before replacing the container.
            CURRENT_CONTAINER=$(docker compose ps -q app 2>/dev/null || true)
            PREVIOUS_IMAGE=$(test -n "$CURRENT_CONTAINER" && docker inspect --format '{{.Config.Image}}' "$CURRENT_CONTAINER" 2>/dev/null || true)
            PREVIOUS_TAG=""
            if [ -n "$PREVIOUS_IMAGE" ]; then
              PREVIOUS_TAG="rollback-${IMAGE_TAG}"
              docker tag "$PREVIOUS_IMAGE" "ghcr.io/${GITHUB_REPOSITORY}:${PREVIOUS_TAG}"
            fi
            echo "Deploying tag: ${IMAGE_TAG}"
            echo "Previous image: ${PREVIOUS_IMAGE:-none}"

            # Pull the specific SHA tag (not latest)
            docker compose pull app
            docker compose up -d --no-deps --force-recreate app
            CONFIGURED_IMAGE=$(docker inspect --format '{{.Config.Image}}' "$(docker compose ps -q app)")
            test "$CONFIGURED_IMAGE" = "ghcr.io/${GITHUB_REPOSITORY}:${IMAGE_TAG}"
            sleep 15

            # Health check with rollback on failure
            if curl -sf http://localhost:3000/api/health; then
              echo "Healthcheck passed. Deploy successful."
            else
              echo "Healthcheck failed. Rolling back to previous version..."
              docker compose logs --tail=50 app

              if [ -n "$PREVIOUS_TAG" ] && [ "$PREVIOUS_TAG" != "" ]; then
                export IMAGE_TAG="$PREVIOUS_TAG"
                docker compose up -d --no-deps --force-recreate app
                sleep 15
                if curl -sf http://localhost:3000/api/health; then
                  echo "Rollback successful. Container restored to previous version: ${PREVIOUS_TAG}"
                else
                  echo "Rollback also failed. Manual intervention required."
                  docker compose logs --tail=50 app
                  exit 1
                fi
              else
                echo "No previous tag found for rollback. Manual intervention required."
                exit 1
              fi
            fi
